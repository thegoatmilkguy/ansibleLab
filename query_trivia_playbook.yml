---
- name: Query Trivia API
  hosts: localhost
  gather_facts: no
  vars_prompt:
    - name: "AMOUNT"
      prompt: "Enter the amount of questions"
      private: no
      default: 42

    - name: "DIFFICULTY"
      prompt: "Enter the difficulty (easy, medium, hard)"
      private: no
      default: "easy"

  tasks:
    - name: Call custom API module
      trivia_api:
        amount: "{{ AMOUNT }}"
        difficulty: "{{ DIFFICULTY }}"
      register: api_result

    - name: write data to local file
      ansible.builtin.copy:
        content: "{{ api_result }}"
        dest: ~/mycode/files/trivia.json

    - name: Display API response
      debug:
        msg: "{{ item['question'] }} Answer: {{ item['correct_answer'] }} Category: {{ item['category'] }}"
      loop: "{{ api_result.questions }}"

