---
- name: Subdirectories with different permissions
  hosts: planetexpress
  gather_facts: no

  tasks:
    - name: Create station_docs subdirectories
      become: true
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/station_docs/{{ item.name }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: logs, mode: "0700" }
        - { name: charts, mode: "0755" }
        - { name: manifests, mode: "0750" }
